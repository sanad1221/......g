<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لـ سوسو</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf1e8; --bg2:#f3d9d2; --ink:#55182f; --wine:#8f3150; --gold:#b98a3c; --soft:#8a6270;
  --glass:rgba(255,250,244,.62); --line:rgba(185,138,60,.45); --sh:rgba(90,30,50,.28); --on:#fff7ef;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1d0f17; --bg2:#33182a; --ink:#f9e8df; --wine:#f2a9bb; --gold:#e3bf6e; --soft:#c9a6b1;
    --glass:rgba(40,20,32,.62); --line:rgba(227,191,110,.4); --sh:rgba(0,0,0,.55); --on:#2a1420;
  }
}
:root[data-theme="dark"]{
  --bg:#1d0f17; --bg2:#33182a; --ink:#f9e8df; --wine:#f2a9bb; --gold:#e3bf6e; --soft:#c9a6b1;
  --glass:rgba(40,20,32,.62); --line:rgba(227,191,110,.4); --sh:rgba(0,0,0,.55); --on:#2a1420;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);overflow:hidden}
html.in{overflow-y:auto;scroll-snap-type:y mandatory}
*{box-sizing:border-box}
body{margin:0;font-family:'Amiri',serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(110% 70% at 50% 0%,var(--bg2),transparent 70%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.disp{font-family:'Aref Ruqaa',serif;font-weight:700;color:var(--wine);margin:0;line-height:1.25;text-align:center}

/* gate */
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;transition:opacity 1s,transform 1s}
#gate.go{opacity:0;transform:scale(1.12);pointer-events:none}
.gcard{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:32px;
  padding:34px 26px 28px;width:min(380px,100%);text-align:center;box-shadow:0 30px 60px -30px var(--sh)}
#gate .disp{font-size:clamp(5.2rem,25vw,8rem);text-shadow:0 2px 0 var(--bg),0 14px 28px var(--sh)}
.sub{margin:0 0 20px;font-size:1.25rem;color:var(--soft)}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
button{font:inherit;font-weight:700;font-size:1.1rem;cursor:pointer;border:0;background:var(--wine);color:var(--on);padding:11px 24px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hint{min-height:1.8em;margin:14px 0 0;color:var(--soft);font-size:1rem}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* story */
.sec{position:relative;z-index:5;min-height:100svh;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:70px 22px}
.panel{background:var(--glass);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid var(--line);border-radius:34px;
  padding:42px 28px;max-width:430px;width:100%;text-align:center;box-shadow:0 34px 60px -34px var(--sh);position:relative}
.panel::before,.panel::after{content:"❦";position:absolute;left:50%;transform:translateX(-50%);color:var(--gold);font-size:1.3rem;line-height:1;background:var(--bg);padding:0 10px;border-radius:99px}
.panel::before{top:-14px}.panel::after{bottom:-14px;transform:translateX(-50%) rotate(180deg)}
.t{font-size:clamp(1.55rem,6.6vw,2.15rem);line-height:2;font-weight:700}
.sig{margin-top:10px;font-family:'Aref Ruqaa',serif;font-size:1.7rem;color:var(--gold)}
.big{font-family:'Aref Ruqaa',serif;color:var(--wine);font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.5;text-shadow:0 2px 0 var(--bg),0 10px 22px var(--sh)}
.hero .panel{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.hero .panel::before,.hero .panel::after{display:none}
.hero .name{font-family:'Aref Ruqaa',serif;font-weight:700;color:var(--wine);font-size:clamp(6.5rem,34vw,12rem);line-height:1.05;text-shadow:0 3px 0 var(--bg),0 18px 34px var(--sh)}
.hero .t{font-size:clamp(1.3rem,5vw,1.7rem);color:var(--soft)}
.w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(14px);transition:opacity .8s,filter .8s,transform .8s;transition-delay:calc(var(--i)*90ms);margin:0 .14em}
.vis .w{opacity:1;filter:none;transform:none}
#cue{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;z-index:8;color:var(--soft);pointer-events:none;opacity:0;transition:opacity .8s}
#cue.on{opacity:1}
@media (prefers-reduced-motion:reduce){.w{transition:none;opacity:1;filter:none;transform:none}.shake{animation:none}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="cue">اسحبي لتحت ↓ · وسيبي الورد يشتغل</div>

<div id="gate">
  <div class="gcard" id="gc">
    <h1 class="disp">سوسو</h1>
    <p class="sub">مفاجأة صغيرة ليكي</p>
    <div class="field"><input id="pw" type="text" autocomplete="off" placeholder="اكتبي الباسورد" aria-label="الباسورد"><button id="unlock">افتحي</button></div>
    <p class="hint" id="hint"></p>
  </div>
</div>

<main id="story" hidden></main>

<script>
/* ====== عدّل هنا ====== */
const PASS=["سوسو","سهيلة","soso","sousou","susu","suheila","soheila"];
const HINT="الباسورد هو اسم الدلع بتاعك 😉";
const SEC=[
  {c:"hero",name:"سوسو",t:"حبيبة قلبي"},
  {t:"أجدع صاحبة في الدنيا… واقفة جنبي، وبتشجعني، وبتهوّن عليا."},
  {t:"بنت حلوة وعسل، ودمها خفيف… ومش ناقصها حاجة."},
  {t:"كل الصفات الحلوة اتجمعت في بنت واحدة، حلوة وعسولة."},
  {t:"ربنا يكرمك يا روحي، ويحققلك كل اللي إنتي عايزاه يا رب."},
  {big:"يا رب المفاجأة تعجبك",t:"واحتفظي بيها بقى… خليها ذكرى بينا 🌹",sig:"شقيي"}
];
/* ===================== */
const $=id=>document.getElementById(id), RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---- بناء الصفحة ---- */
const story=$("story");
SEC.forEach(s=>{
  const sec=document.createElement("section"); sec.className="sec "+(s.c||"");
  const p=document.createElement("div"); p.className="panel";
  const words=(txt,cls,base)=>{const d=document.createElement("div"); d.className=cls;
    txt.split(" ").forEach((w,i)=>{const e=document.createElement("span"); e.className="w"; e.style.setProperty("--i",base+i); e.textContent=w; d.appendChild(e);}); return d;};
  let n=0;
  if(s.name){p.appendChild(words(s.name,"name",0)); n=1;}
  if(s.big){p.appendChild(words(s.big,"big",0)); n=s.big.split(" ").length;}
  p.appendChild(words(s.t,"t",n));
  if(s.sig){const g=words("— "+s.sig,"sig",n+s.t.split(" ").length+1); p.appendChild(g);}
  sec.appendChild(p); story.appendChild(sec);
});
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle("vis",e.isIntersecting)),{threshold:.55});
story.querySelectorAll(".sec").forEach(s=>io.observe(s));

/* ---- رسم الوردة ---- */
const PAL=[["#fbd3da","#eb94a5","#c65670"],["#fde0df","#f0aab4","#d27384"],["#ea6c85","#c63d62","#8e1f45"],["#f5b0bd","#de6f88","#a73a5d"],["#fdeee3","#f3c9bb","#da9490"]];
function rose(pal,S=180){
  const c=document.createElement("canvas"); c.width=c.height=S; const g=c.getContext("2d"); g.translate(S/2,S/2);
  const L=[{n:6,d:.2,x:.21,y:.27},{n:5,d:.16,x:.17,y:.22},{n:4,d:.115,x:.13,y:.17},{n:3,d:.065,x:.09,y:.12}];
  g.shadowColor="rgba(80,20,40,.28)"; g.shadowBlur=S*.05;
  L.forEach((l,k)=>{
    for(let i=0;i<l.n;i++){
      g.save(); g.rotate(i/l.n*Math.PI*2+k*.55); const cy=-l.d*S;
      const gr=g.createRadialGradient(0,cy+l.y*S*.25,0,0,cy,l.y*S);
      gr.addColorStop(0,k<2?pal[0]:pal[1]); gr.addColorStop(.75,k<2?pal[1]:pal[2]); gr.addColorStop(1,pal[2]);
      g.fillStyle=gr; g.beginPath(); g.ellipse(0,cy,l.x*S,l.y*S,0,0,Math.PI*2); g.fill();
      g.shadowBlur=0; g.strokeStyle="rgba(110,25,55,.25)"; g.lineWidth=S*.006; g.stroke(); g.restore();
    }
  });
  g.shadowBlur=0; g.fillStyle=pal[2]; g.beginPath(); g.arc(0,0,S*.05,0,7); g.fill();
  g.strokeStyle="rgba(90,15,40,.55)"; g.lineWidth=S*.012; g.lineCap="round"; g.beginPath();
  g.arc(0,0,S*.025,0,5); g.moveTo(S*.04,0); g.arc(0,0,S*.045,0,5.4); g.stroke();
  return c;
}
const SP=PAL.map(p=>rose(p));

/* ---- مطر الورد ---- */
const cv=$("rain"), ctx=cv.getContext("2d"); let W=0,H=0,DPR=1;
function size(){DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",size); size();
const NB=RM?18:(W<640?44:78), R=[];
function mk(top,burst){
  const s=.18+Math.random()**1.5*.85;
  return {x:Math.random()*W,y:top?-60-Math.random()*H*.3:Math.random()*H,s,v:(26+s*120)*(RM?.35:1),
    sw:.6+Math.random()*1.1,ph:Math.random()*6.3,r:Math.random()*6.3,sp:(Math.random()-.5)*(RM?.4:2.2),
    k:Math.floor(Math.random()*SP.length),a:.55+s*.45,vx:0,vy:0,tmp:!!burst};
}
for(let i=0;i<NB;i++)R.push(mk(false));
R.sort((a,b)=>a.s-b.s);
function storm(n){for(let i=0;i<n;i++){const q=mk(true,true); q.v*=1.5; R.push(q);}}
function pop(x,y){for(let i=0;i<16;i++){const q=mk(false,true); q.x=x; q.y=y; q.s=.16+Math.random()*.4; q.a=.95;
  const a=Math.random()*6.3, f=140+Math.random()*320; q.vx=Math.cos(a)*f; q.vy=Math.sin(a)*f-220; q.tmp=true; R.push(q);}}
addEventListener("pointerdown",e=>{if(document.documentElement.classList.contains("in")||e.target.closest("#gate"))pop(e.clientX,e.clientY);});

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05); last=now; const T=now/1000;
  ctx.clearRect(0,0,W,H);
  for(let i=R.length-1;i>=0;i--){
    const q=R[i];
    q.y+=(q.v+q.vy)*dt; q.x+=(Math.sin(T*q.sw+q.ph)*22+q.vx)*dt; q.r+=q.sp*dt; q.vx*=.985; q.vy*=.985;
    const w=26+q.s*104;
    if(q.y>H+w){ if(q.tmp){R.splice(i,1);continue;} q.y=-w; q.x=Math.random()*W; }
    ctx.globalAlpha=q.a; ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.r);
    ctx.scale(1,.78+.22*Math.cos(T*q.sw+q.ph)); ctx.drawImage(SP[q.k],-w/2,-w/2,w,w); ctx.restore();
  }
  ctx.globalAlpha=1;
}
requestAnimationFrame(frame);

/* ---- بوابة ---- */
const norm=s=>s.trim().toLowerCase().replace(/[\u064B-\u065F]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي"), ok=PASS.map(norm); let tries=0;
function unlock(){
  const v=norm($("pw").value); if(!v)return;
  if(ok.includes(v)){
    $("gate").classList.add("go"); story.hidden=false; document.documentElement.classList.add("in"); scrollTo(0,0);
    storm(RM?10:70); setTimeout(()=>{$("gate").hidden=true; $("cue").classList.add("on");},1000);
    setTimeout(()=>$("cue").classList.remove("on"),6500);
  }else{
    tries++; const g=$("gc"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
    $("hint").textContent=tries<2?"قربتي… جربي تاني":HINT;
  }
}
$("unlock").onclick=unlock; $("pw").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
</script>
</body>
</html>
