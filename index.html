<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار التفاعلي الشامل للاقتصاد - Gasser</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.85);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --error: #f43f5e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
        }
        header h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 5px; }
        header p { color: var(--text-muted); }

        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .question-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .option-btn:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
        .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: #34d399; }
        .option-btn.wrong { background: rgba(244, 63, 94, 0.2); border-color: var(--error); color: #f87171; }

        .analysis-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--primary);
            border-radius: 10px;
            display: none;
        }
        .analysis-box h4 { color: var(--primary); margin-bottom: 8px; }
        
        .next-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            display: none;
            margin-top: 20px;
            width: 100%;
        }
        .next-btn:hover { background: #6366f1; }
        .score-screen { text-align: center; display: none; }
        .score-screen h2 { color: var(--success); margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>اختبار مرونات الطلب والعرض التفاعلي</h1>
            <p>إعداد الطالب: Gasser</p>
        </header>

        <div class="quiz-card" id="quizContainer">
            <div id="questionScreen">
                <div class="question-title" id="questionText">جاري تحميل السؤال...</div>
                <div class="options-list" id="optionsList"></div>
                <div class="analysis-box" id="analysisBox">
                    <h4>التحليل والتوضيح العلمي:</h4>
                    <p id="analysisText"></p>
                </div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">السؤال التالي</button>
            </div>

            <div class="score-screen" id="scoreScreen">
                <h2>لقد أنهيت الاختبار بنجاح يا Gasser!</h2>
                <p id="scoreText" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
                <button class="next-btn" style="display: block;" onclick="restartQuiz()">إعادة الاختبار</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                q: "1. متى تتحول المعرفة إلى علم بناءً على الماتريال؟",
                options: [
                    "إذا كانت مجرد آراء شخصية غير قابلة للنقاش",
                    "إذا كانت معبّرة عن الواقع، وذات منهج علمي، وقابلة للاختبار",
                    "إذا كانت معتمدة على التخمين الفردي",
                    "إذا كانت مرتبطة بالماضي فقط"
                ],
                correct: 1,
                analysis: "تتحول المعرفة إلى علم إذا توفرت فيها الشروط الثلاثة: أن تعبر عن الواقع، وتستند لمنهج علمي، وتكون قابلة للاختبار والقياس[cite: 1]."
            },
            {
                q: "2. في حالة السلع العادية، كيف يكون ميل منحنى الطلب؟",
                options: [
                    "موجب الميل",
                    "أفقي تماماً (لا نهائي)",
                    "سالب الميل (علاقة عكسية بين السعر والكمية)",
                    "رأسي تماماً (عديم المرونة)"
                ],
                correct: 2,
                analysis: "منحنى الطلب للسلع العادية يكون سالب الميل لوجود علاقة عكسية بين سعر السلعة والكمية المطلوبة منها[cite: 1]."
            },
            {
                q: "3. ماذا يحدث للإيراد الكلي للمنتج عندما يكون الطلب متكافئ المرونة (مرونة = 1)؟",
                options: [
                    "يزيد بشكل مستمر مع ارتفاع السعر",
                    "يقل مع ارتفاع السعر",
                    "يظل الإيراد الكلي ثابتاً مهما تغير السعر",
                    "ينعدم تماماً"
                ],
                correct: 2,
                analysis: "في حالة الطلب متكافئ المرونة، التغير النسبي في السعر يعادله تماماً تغير نسبي مساوي في الكمية، مما يظل الإيراد الكلي ثابتاً[cite: 2, 24, 25]."
            },
            {
                q: "4. متى تنعدم تكلفة الفرصة البديلة لعنصر إنتاج؟",
                options: [
                    "عندما يكون له عدد كبير من البدائل",
                    "عندما يكون للعنصر استخدام واحد فقط",
                    "عندما ترتفع تكلفة استخدامه",
                    "عندما ينخفض سعر المنتج النهائي"
                ],
                correct: 1,
                analysis: "تنعدم تكلفة الفرصة البديلة تماماً إذا لم يكن للعنصر سوى استخدام واحد فقط، وبالتالي لا توجد بدائل ضحينا بها[cite: 2]."
            },
            {
                q: "5. إذا كانت مرونة الطلب التقاطعية بين سلعتين موجبة، فهذا يعني أن السلعتين:",
                options: [
                    "سلعتان مكملتان",
                    "سلعتان مستقلتان لا علاقة بينهما",
                    "سلعتان بديلتان",
                    "سلعتان رديئتان"
                ],
                correct: 2,
                analysis: "الإشارة الموجبة في مرونة الطلب التقاطعية تعني أن زيادة سعر السلعة الأولى تؤدي لزيادة الطلب على السلعة الثانية، وهما سلعتان بديلتان[cite: 33]."
            }
        ];

        let currentQ = 0;
        let score = 0;
        let answered = false;

        function loadQuestion() {
            answered = false;
            const q = quizData[currentQ];
            document.getElementById('questionText').innerText = q.q;
            document.getElementById('analysisBox').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';

            const optsList = document.getElementById('optionsList');
            optsList.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx);
                optsList.appendChild(btn);
            });
        }

        function selectOption(selectedIdx) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQ];
            const buttons = document.querySelectorAll('.option-btn');

            buttons.forEach((btn, idx) => {
                if (idx === q.correct) btn.classList.add('correct');
                else if (idx === selectedIdx) btn.classList.add('wrong');
                btn.style.cursor = 'default';
            });

            if (selectedIdx === q.correct) score++;

            document.getElementById('analysisText').innerText = q.analysis;
            document.getElementById('analysisBox').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < quizData.length) {
                loadQuestion();
            } else {
                document.getElementById('questionScreen').style.display = 'none';
                document.getElementById('scoreScreen').style.display = 'block';
                document.getElementById('scoreText').innerText = `لقد أجبت بشكل صحيح على ${score} من أصل ${quizData.length} أسئلة.`;
            }
        }

    function restartQuiz() {
            currentQ = 0;
            score = 0;
            document.getElementById('questionScreen').style.display = 'block';
            document.getElementById('scoreScreen').style.display = 'none';
            loadQuestion();
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
